<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeffrey Haines | jefhai</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9f9f9;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin-bottom: 0.2em;
      font-size: 2.25rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .contact {
      margin-top: 2rem;
    }

    .tools {
      margin-top: 3rem;
      text-align: left;
    }

    .tools h2 {
      margin: 0 0 0.35rem;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #727a76;
    }

    .tools-intro {
      margin: 0 0 1rem;
      color: #555d59;
      font-size: 0.95rem;
    }

    .tools-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1rem;
    }

    .contact a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 2px solid #aaa;
      border-radius: 50%;
      color: #777;
      text-decoration: none;
      font-size: 20px;
      transition: background-color 0.2s, color 0.2s;
    }

    .contact a:hover {
      background-color: #e0e0e0;
      color: #333;
    }

    @media (max-width: 480px) {
      body {
        padding: 1.25rem;
      }

      h1 {
        font-size: 1.75rem;
      }
      p {
        font-size: 1rem;
      }

    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Jeffrey Haines</h1>
    <p>
      Senior Software Engineer with 10+ years of experience in Enterprise SaaS backend development, full-stack development,
      and native mobile application development. Currently working at Oracle.
    </p>
    <div class="contact">
      <a href="mailto:contact@jefhai.com" aria-label="Email Jeffrey Haines">
        <i class="fas fa-envelope"></i>
      </a>
      <a href="https://linkedin.com/in/jefhai" aria-label="LinkedIn Jeffrey Haines">
        <i class="fa-brands fa-linkedin"></i>
      </a>
      <a href="https://github.com/jefhai" aria-label="GitHub Jeffrey Haines">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
    <section class="tools" aria-labelledby="tools-heading">
      <h2 id="tools-heading">Tools</h2>
      <p class="tools-intro">Small, focused utilities built for everyday work.</p>
      <div class="tools-list" data-module-cards="scratchpad"></div>
    </section>
  </div>
  <script type="module" src="./modules/load-cards.js"></script>
</body>
</html>
